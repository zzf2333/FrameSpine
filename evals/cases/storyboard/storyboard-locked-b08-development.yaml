id: storyboard-locked-b08-development
title: Process beat must use multi-frame development not one result card
suite: storyboard
slice:
  input_mode: locked-script
  visual_medium: supplied-by-fixture
  content_type: character-story
  stage: story-flow

start_state:
  series_fixture: fixtures/series-projects/series-a
  user_input: fixtures/inputs/locked-script-b08.md
  provider_capability: fixtures/provider-capabilities/no-reference-upload.json

target_stage: story-flow
release_gate: true
recommended_trials: 5

must_do:
  - preserve source text
  - create official storyboard surface
  - represent B08 as at least three key visual states
  - make accumulation and payoff readable on the board without inspector prose
  - stop after storyboard handoff

must_not_do:
  - collapse process into one generic result frame
  - use empty boxes or generic shapes as stand-ins for reviews users and regions
  - explain development only in inspector narrative
  - start image animatic before confirmation

required_artifacts:
  - SCRIPT.md
  - STORYBOARD.md
  - official storyboard route
  - frame sources for B08-F1 B08-F2 B08-F3 or equivalent multi-frame development

expected_frame_development:
  beat: B08
  minimum_frames: 3
  progression:
    - ongoing shop and core product
    - accumulation of reviews users or regions
    - payoff evidence and ending handoff

gates:
  - surface
  - frame_canvas
  - sequence
  - source_separation
  - stage_boundary

human_review:
  - without inspector can a reviewer retell the three-step development
  - are F1 F2 F3 visually distinct
  - is evidence or an explicit evidence plan visible in the payoff frame
