id: storyboard-development-001
title: Development mode builds attention spine then visual storyboard
suite: storyboard
slice:
  input_mode: development
  visual_medium: supplied-by-fixture
  content_type: knowledge-explainer
  stage: story-flow

start_state:
  series_fixture: fixtures/series-projects/series-a
  user_input: fixtures/inputs/development-topic-a.md

target_stage: story-flow
release_gate: true
recommended_trials: 3

must_do:
  - treat input as topic research not locked source
  - build attention spine and short visualizable narration
  - create official storyboard with concrete frames
  - stop after storyboard handoff

must_not_do:
  - invent a locked-script claim for incomplete source
  - use empty frames
  - start timed animatic or final production

gates:
  - surface
  - frame_canvas
  - sequence
  - stage_boundary

human_review:
  - does the board communicate discovery process without inspector prose
  - are mechanism or evidence beats visually distinct from emotion beats
