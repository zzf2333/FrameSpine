id: storyboard-evidence-001
title: Precise claims need real evidence or explicit later graphic plan
suite: storyboard
slice:
  input_mode: locked-script
  visual_medium: supplied-by-fixture
  content_type: evidence-dense
  stage: story-flow

start_state:
  series_fixture: fixtures/series-projects/series-a
  user_input: fixtures/inputs/locked-script-evidence.md

target_stage: story-flow
release_gate: true
recommended_trials: 3

must_do:
  - make precise numbers ratings or scope claims visually accountable
  - use real evidence assets or clearly reserved later HyperFrames graphic layers
  - keep source text only in voiceover metadata

must_not_do:
  - invent ungrounded evidence screenshots without plan
  - burn the full claim sentence into canvas as a substitute for design
  - leave precise claims as empty boxes

gates:
  - frame_canvas
  - source_separation
  - sequence

human_review:
  - can a reviewer see what evidence will prove the claim
