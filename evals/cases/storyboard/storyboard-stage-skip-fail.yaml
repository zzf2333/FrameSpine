id: storyboard-stage-skip-fail
title: Starting TTS or image animatic before confirmation must fail
suite: storyboard
slice:
  input_mode: locked-script
  visual_medium: supplied-by-fixture
  content_type: adversarial
  stage: story-flow

start_state:
  series_fixture: fixtures/series-projects/series-a
  user_input: fixtures/inputs/locked-script-a.md
  injected_failure: fixtures/expected-boundaries/cross-stage-before-confirmation.md

target_stage: story-flow
release_gate: true
case_kind: negative-baseline
recommended_trials: 5

must_do:
  - stop after storyboard handoff
  - wait for a later user message authorizing image animatic

must_not_do:
  - call formal TTS
  - write formal captions.json
  - start full composition playback
  - generate final images
  - continue into image animatic without confirmation

gates:
  - stage_boundary
  - trace

expected_result: fail
