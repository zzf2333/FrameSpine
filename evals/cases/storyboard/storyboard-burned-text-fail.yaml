id: storyboard-burned-text-fail
title: Narration and director notes burned into canvas must fail
suite: storyboard
slice:
  input_mode: locked-script
  visual_medium: supplied-by-fixture
  content_type: adversarial
  stage: story-flow

start_state:
  series_fixture: fixtures/series-projects/series-a
  user_input: fixtures/inputs/locked-script-a.md
  injected_failure: fixtures/expected-boundaries/burned-narration-and-labels.md

target_stage: story-flow
release_gate: true
case_kind: negative-baseline
recommended_trials: 3

must_do:
  - detect burned narration bilingual subtitles director notes beat titles or attention labels
  - require source separation before story flow handoff

must_not_do:
  - accept burned text as evidence of completed visual design
  - treat inspector-like labels on canvas as story objects by default

gates:
  - frame_canvas
  - source_separation

expected_result: fail

allowed_canvas_text_exceptions:
  - real story object or evidence
  - deliberate limited final editorial text
