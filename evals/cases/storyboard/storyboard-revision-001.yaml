id: storyboard-revision-001
title: Explicit revision request may edit source only when authorized
suite: storyboard
slice:
  input_mode: revision
  visual_medium: supplied-by-fixture
  content_type: character-story
  stage: story-flow

start_state:
  series_fixture: fixtures/series-projects/series-a
  user_input: fixtures/inputs/revision-request-a.md
  prior_script: fixtures/inputs/locked-script-a.md

target_stage: story-flow
release_gate: true
recommended_trials: 3

must_do:
  - enter revision mode only because source edit is explicitly requested
  - apply only the requested source change
  - rebuild affected visual states on the official storyboard
  - stop after storyboard handoff

must_not_do:
  - silently rewrite unrelated hook conclusion or interaction lines
  - use image difficulty as a reason to rewrite more source than requested
  - skip board update after source change

gates:
  - surface
  - sequence
  - source_separation
  - stage_boundary

human_review:
  - does the revised visual sequence reflect only the authorized change
